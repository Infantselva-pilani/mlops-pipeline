
name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ master, MID_SEM, FINAL_SEM, test_FS ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  continuous-integration-and-delivery:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python Environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install Project Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Static Code Analysis
      - name: Run Flake8 Static Code Analysis
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=105 --statistics

      # 5. Prepare Benchmark Dataset
      - name: Materialize Benchmark Dataset for CI Runner
        run: |
          python -c "
          from pathlib import Path
          import numpy as np, pandas as pd

          p = Path('data/churn.csv')

          if not p.exists():
              p.parent.mkdir(parents=True, exist_ok=True)

              rng = np.random.default_rng(42)
              n = 1200

              tenure = rng.integers(1, 73, size=n)
              monthly = np.round(rng.uniform(18.25, 118.75, size=n), 2)
              total = np.round(tenure * monthly, 2)

              churn = np.where(
                  (monthly > 75) & (tenure < 24),
                  'Yes',
                  'No'
              )

              pd.DataFrame({
                  'tenure': tenure,
                  'MonthlyCharges': monthly,
                  'TotalCharges': total,
                  'Churn': churn
              }).to_csv(p, index=False)
          "

      # 6. Baseline Model Training
      - name: Execute Baseline Model Training (MLflow)
        run: |
          python src/train.py

      # 7. Drift Detection and Model Recovery
      - name: Execute Synthetic Drift Stress Test & Recovery Benchmark
        run: |
          python -m src.simulate_drift

      # 8. Re-verify Baseline Model
      - name: Re-verify Baseline Model for Serving Gate
        run: |
          python src/train.py

      # 9. Automated Testing
      - name: Run Automated Pytest Suite (Serving & Monitoring Gates)
        run: |
          pytest -v

      # 10. Normalize Docker Image Owner
      - name: Normalize Docker Image Owner
        id: image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      # 11. Build Docker Image
      - name: Build Reproducible Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ steps.image.outputs.owner }}/churn-service:${{ github.sha }} \
            -t ghcr.io/${{ steps.image.outputs.owner }}/churn-service:latest \
            .

      # 12. Authenticate with GitHub Container Registry
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # 13. Push Docker Image to GHCR
      - name: Push Docker Image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ steps.image.outputs.owner }}/churn-service:${{ github.sha }}
          docker push ghcr.io/${{ steps.image.outputs.owner }}/churn-service:latest
